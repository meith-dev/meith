# Cutting a release, from the Actions tab: give it a version and it bumps
# every place the version is written, commits that to main, tags it, and
# starts the Release workflow against the tag. docs/release.md § How a
# release happens is the narrative.

name: Cut a release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version to release — major.minor.patch, no leading v'
        required: true

permissions:
  contents: write
  actions: write

jobs:
  cut:
    name: Bump, commit, tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # A re-run converges rather than refuses: a tree already at the version
      # skips the bump, a commit already on main skips the push, an existing
      # tag is reused — so a run that failed halfway is fixed by pressing Run
      # again, not by cleaning up.
      - name: Bump every version together
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "$(node -p "require('./package.json').version")" = "$VERSION" ]; then
            echo "the tree is already at $VERSION"
          else
            node scripts/release-bump.mjs "$VERSION"
            pnpm install --lockfile-only
          fi
          node scripts/release-check.mjs --tag "v$VERSION"

      # The push to main needs the Actions app on the bypass list of any
      # ruleset requiring pull requests — docs/release.md § How a release
      # happens.
      - name: Commit and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet || git commit -am "chore(release): v$VERSION"
          git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null || git tag "v$VERSION"
          git push origin HEAD:main
          git push origin "v$VERSION"

      # A tag pushed with GITHUB_TOKEN triggers no workflows — GitHub's
      # recursion guard — so the release is dispatched explicitly, against
      # the tag this job just pushed.
      - name: Start the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh workflow run release.yml --ref "v$VERSION"
