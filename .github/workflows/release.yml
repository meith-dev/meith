# The release act. Pushing a vX.Y.Z tag runs this; docs/contributing/release.md is the
# narrative — what a release is, the version policy, and every step below in
# prose. CI (ci.yml) remains the gate every change passes; this workflow only
# ever runs on a commit that has already been through it.

name: Release

# Runs on a tag push — cut-release.yml's deploy-key push included. The manual
# dispatch exists for re-running against an existing tag; dispatched against
# anything that is not a release tag, the first job refuses.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/meith-dev/meith
  # MEI-77: the framework-only base image a scaffolded board's own Dockerfile
  # starts FROM. See docker/Dockerfile.base and the `base-image` job below.
  BASE_IMAGE: ghcr.io/meith-dev/meith-base
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  versions:
    name: The tag and the tree agree
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: node scripts/release-check.mjs --tag "$GITHUB_REF_NAME"

  # One job per architecture, on that architecture's own runner — no QEMU, so
  # the boot tests below run the same binaries an operator will. Each job
  # pushes an arch-suffixed tag; `publish` merges them into the real tags only
  # after both architectures have booted in every role.
  build:
    name: Build and boot (${{ matrix.arch }})
    needs: versions
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forum_release
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the image, stamped
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker build -f docker/Dockerfile \
            --build-arg MEITH_VERSION="$VERSION" \
            --build-arg MEITH_COMMIT="$GITHUB_SHA" \
            -t meith:release .

      # The same boot checks as ci.yml's `image` job, compact. That job's
      # comments carry the history of why each assertion exists.
      - name: Apply migrations (migrate role)
        run: |
          docker run --rm --network host \
            -e COMMUNITY_ROLE=migrate \
            -e DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/forum_release \
            -e DATA_SOURCE=postgres \
            -e AUTH_SECRET=release-boot-test-auth-secret-long-enough \
            -e TICK_SECRET=release-boot-test-tick-secret-long-enough \
            meith:release

      - name: Boot the web role, and it renders
        run: |
          docker run -d --name meith-web --network host \
            -e DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/forum_release \
            -e DATA_SOURCE=postgres \
            -e AUTH_SECRET=release-boot-test-auth-secret-long-enough \
            -e TICK_SECRET=release-boot-test-tick-secret-long-enough \
            -e APP_URL=http://127.0.0.1:3000 \
            meith:release
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1 && break
            test "$i" != 40 || { echo "::error::the web role never became healthy"; docker logs meith-web; exit 1; }
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ | grep -q '<main' \
            || { echo "::error::the board did not render"; docker logs meith-web; exit 1; }

      - name: Boot the worker role, and it survives a tick
        run: |
          docker run -d --name meith-worker --network host --restart=no \
            -e COMMUNITY_ROLE=worker \
            -e DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5432/forum_release \
            -e DATA_SOURCE=postgres \
            -e AUTH_SECRET=release-boot-test-auth-secret-long-enough \
            -e TICK_SECRET=release-boot-test-tick-secret-long-enough \
            -e QUEUE_DRIVER=postgres -e CACHE_DRIVER=memory \
            meith:release
          sleep 90
          docker ps --filter name=meith-worker --filter status=running | grep -q meith-worker \
            || { echo "::error::the worker exited instead of looping"; docker logs meith-worker; exit 1; }
          starts=$(docker logs meith-worker 2>&1 | grep -c 'worker started' || true)
          test "$starts" = "1" \
            || { echo "::error::expected one 'worker started', saw $starts"; docker logs meith-worker; exit 1; }
          state=$(docker inspect -f '{{.State.Health.Status}}' meith-worker)
          test "$state" = "healthy" \
            || { echo "::error::worker health is $state"; exit 1; }
          docker run --rm --network host -e PGPASSWORD=postgres postgres:18-alpine \
            psql -h 127.0.0.1 -U postgres -d forum_release -tAc 'select count(*) from tasks' \
            | grep -qE '^[1-9]' \
            || { echo "::error::no tasks were registered"; docker logs meith-worker; exit 1; }

      - name: Stop
        if: always()
        run: docker rm -f meith-web meith-worker 2>/dev/null || true

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the architecture tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker tag meith:release "$IMAGE:$VERSION-${{ matrix.arch }}"
          docker push "$IMAGE:$VERSION-${{ matrix.arch }}"

  # The npm half of the release: every non-private workspace package, in
  # dependency order, at the tag's version. Gated on the boot-tested build so
  # nothing reaches the registry from a release whose image did not boot, and
  # re-runnable — a version already on the registry is skipped, not an error.
  #
  # No token: npm trusted publishing exchanges this job's OIDC identity for a
  # short-lived credential, and provenance comes with it. Each package names
  # this repository and workflow as its trusted publisher on npmjs.com — see
  # docs/contributing/release.md § What publishes to npm.
  npm:
    name: Publish the packages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
      # Trusted publishing lives in the npm CLI from 11.5.1; force the latest
      # rather than trust whatever version the runner's Node happens to bundle.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter create-meith build
      - run: node scripts/npm-publish.mjs

  # MEI-137: 0.21.0 was cut to fix a board that rendered raw message keys and
  # had no CSS, and shipped with only the first of the two fixes — a stacked
  # pull request merged into a base that had already merged, so its commits
  # never reached main. Nothing noticed: main was green, the tag was cut, the
  # packages published, and the release notes described a fix that was not in
  # them. Every other gate in this repository looks at the repository. This one
  # looks at what a user downloads: it scaffolds from the published
  # create-meith, installs from the real registry, and boots the result at both
  # materialization depths. It runs after npm for that reason and gates
  # `publish`, so a broken artefact stops the release being announced even
  # though it cannot stop it being published.
  published-board:
    name: A board built from the published packages boots
    needs: npm
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: published_board_smoke
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Scaffold from the registry, build and boot at both depths
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/published_board_smoke
        run: |
          MEITH_VERSION="${GITHUB_REF_NAME#v}" pnpm published:board:smoke

  # MEI-77: the framework base image a scaffolded board's own Dockerfile
  # starts FROM (docker/Dockerfile.base) — deps + framework layers only, no
  # board, no secrets. Needs [build, npm] rather than just `versions`: the
  # image it builds `npm install`s @meith/web, @meith/cli and
  # @meith/theme-default straight from the real npm registry, so those three
  # have to already be there. On a release whose npm job skipped one of them
  # as "new to the registry" (docs/contributing/release.md, "A package's first publish"),
  # this job fails the same way and for the same reason — re-run the Release
  # workflow against the tag once the package is published by hand, exactly
  # as that document already describes for the rest of the pipeline.
  base-image:
    name: Build the base image (${{ matrix.arch }})
    needs: [build, npm]
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the base image, stamped
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The `npm` job just published these exact versions moments ago —
          # this Dockerfile's own `npm install` can briefly outrun registry
          # replication and see an ETARGET for a package that publish-completed
          # just seconds earlier. Not a network-transient error npm itself
          # retries (a hard "no such version" response, not a timeout), so
          # the retry has to happen here instead.
          for attempt in 1 2 3 4 5; do
            if docker build -f docker/Dockerfile.base \
              --build-arg MEITH_VERSION="$VERSION" \
              -t meith-base:release .; then
              exit 0
            fi
            echo "::warning::base image build attempt $attempt failed, retrying in 20s (likely npm registry replication lag right after this release's own packages published)"
            sleep 20
          done
          echo "::error::base image build failed after 5 attempts"
          exit 1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the architecture tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker tag meith-base:release "$BASE_IMAGE:$VERSION-${{ matrix.arch }}"
          docker push "$BASE_IMAGE:$VERSION-${{ matrix.arch }}"

  publish:
    name: Tags, the release branch, and the draft notes
    needs: [build, npm, base-image, published-board]
    runs-on: ubuntu-24.04
    steps:
      # Full history, not the default shallow clone: pushing over an existing
      # release branch needs that branch's current commit present locally, or
      # the git client refuses with "fetch first" before the server can even
      # check the fast-forward.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # X.Y.Z never moves again and is what the compose file pins; X.Y and
      # latest are floating conveniences for trying the image, and nothing
      # this repository ships deploys either — see docs/contributing/release.md.
      - name: Merge the architectures under the release tags
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          LINE="${VERSION%.*}"
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:$LINE" \
            -t "$IMAGE:latest" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"

      # The base image carries no floating tag: nothing pulls it by anything
      # but an exact version — a scaffolded board's Dockerfile always pins
      # the release it was scaffolded against, the same way it pins
      # @meith/web itself. See docs/getting-started/deployment/docker-compose.md, "Custom boards".
      - name: Merge the base image's architectures
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            -t "$BASE_IMAGE:$VERSION" \
            "$BASE_IMAGE:$VERSION-amd64" "$BASE_IMAGE:$VERSION-arm64"

      # Fast-forward only: a tag not descended from `release` is a mistake this
      # push refuses rather than rewrites.
      - name: Move the release branch to the tag
        run: git push origin "HEAD:refs/heads/release"

      # Skipped when the release already exists — this job has proven it gets
      # re-run, and a re-run must not clobber a draft a maintainer has edited.
      - name: Draft the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "the release for $GITHUB_REF_NAME already exists, leaving it alone"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          cat > /tmp/notes-header.md <<EOF
          \`\`\`
          docker pull $IMAGE:$VERSION
          npm install @meith/plugin-kit@$VERSION @meith/theme-kit@$VERSION
          \`\`\`

          **Migrations:** _fill in before publishing — none / adds only / removes or renames._
          Patch releases carry no migrations; docs/guides/operations/upgrading.md is the operator's side of that promise.

          ---
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes-header.md \
            --generate-notes

  publish-templates:
    name: Sync the deploy templates to their repositories
    needs: publish
    runs-on: ubuntu-24.04
    env:
      HAS_APP: ${{ secrets.TEMPLATE_SYNC_APP_ID != '' && secrets.TEMPLATE_SYNC_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Mint an installation token for the template repositories
        if: env.HAS_APP == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.TEMPLATE_SYNC_APP_ID }}
          private-key: ${{ secrets.TEMPLATE_SYNC_APP_PRIVATE_KEY }}
          owner: meith-dev
          repositories: |
            template
            vercel-template
      - name: Mirror the templates into their repositories and tag them
        env:
          TEMPLATE_SYNC_TOKEN: ${{ steps.app-token.outputs.token }}
        run: pnpm templates:sync
