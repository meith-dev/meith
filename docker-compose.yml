# F04 — a complete self-hosted board: web + Postgres + the cron tick.
#
# `docker compose up` should produce a working forum with no other setup, which
# is the parity claim against MyBB's "upload and run" story.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forum}
      POSTGRES_DB: forum
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U forum -d forum']
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    # Runs to completion then exits; `web` waits for it so the schema is always
    # applied before the first request rather than racing it.
    environment:
      # A role, not a command: drizzle-kit is a development tool and is not in
      # the pruned standalone node_modules, so `node node_modules/.bin/drizzle-kit`
      # never worked here. `FORUM_ROLE=migrate` runs the same runMigrations()
      # the operator CLI does.
      FORUM_ROLE: migrate
      DATABASE_URL: postgres://forum:${POSTGRES_PASSWORD:-forum}@postgres:5432/forum
      DATA_SOURCE: postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  web:
    build: .
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgres://forum:${POSTGRES_PASSWORD:-forum}@postgres:5432/forum
      DATA_SOURCE: postgres
      # Required. Generate with: openssl rand -base64 32
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      # Guards the tick endpoint, which is publicly routable.
      TICK_SECRET: ${TICK_SECRET:?TICK_SECRET must be set}
      QUEUE_DRIVER: postgres
      CACHE_DRIVER: next
      FILESTORE_DRIVER: local
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    volumes:
      - uploads:/app/.uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # F04's worker: the same image, with FORUM_ROLE=worker, running the scheduler
  # in-process on its own one-minute loop.
  #
  # It replaces the `tick` sidecar below rather than joining it — running both
  # is harmless (the task claim is what makes concurrent ticks safe) but it is
  # two things doing one job. The sidecar is kept, commented, because a board
  # that would rather not give a second container database credentials can use
  # it instead; that is the trade, and it is the operator's to make.
  worker:
    build: .
    restart: unless-stopped
    environment:
      FORUM_ROLE: worker
      DATABASE_URL: postgres://forum:${POSTGRES_PASSWORD:-forum}@postgres:5432/forum
      DATA_SOURCE: postgres
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      TICK_SECRET: ${TICK_SECRET:?TICK_SECRET must be set}
      QUEUE_DRIVER: postgres
      CACHE_DRIVER: memory
      FILESTORE_DRIVER: local
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    volumes:
      - uploads:/app/.uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The pre-worker approach, kept for the operator who prefers it: a tiny
  # sidecar curling the tick endpoint on the cadence vercel.json declares.
  # Enable this *or* `worker`, not both.
  tick:
    profiles: ['curl-tick']
    image: alpine:3.20
    restart: unless-stopped
    environment:
      TICK_SECRET: ${TICK_SECRET:?TICK_SECRET must be set}
    command:
      - sh
      - -c
      - |
        apk add --no-cache curl >/dev/null
        while true; do
          curl -fsS -m 55 -H "Authorization: Bearer $$TICK_SECRET" \
            http://web:3000/api/system/tick >/dev/null 2>&1 \
            || echo "tick failed at $$(date -Is)"
          sleep 60
        done
    depends_on:
      - web

volumes:
  pgdata:
  uploads:
