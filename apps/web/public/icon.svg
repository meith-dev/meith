<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Meith">
  <!--
    The same mark the header draws: a board, reduced to a panel with two threads
    in it. A static asset cannot read the design tokens, so the accent here is a
    mid step of the ramp rather than either scheme's value — light enough to hold
    against a dark tab strip, dark enough to hold against a light one.
  -->
  <g fill="#0b8f66">
    <rect x="2" y="3" width="28" height="20" rx="6"/>
    <path d="M10 19 L8.4 28.6 L16.6 22.2 Z"/>
  </g>
  <g fill="#ffffff">
    <rect x="8" y="9" width="16" height="2.8" rx="1.4"/>
    <rect x="8" y="14.4" width="10" height="2.8" rx="1.4"/>
  </g>
</svg>
