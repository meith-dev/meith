<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Meith">
  <!--
    Four fields and the walls between them, the same townland the hero draws.
    The one gorse-coloured field is the accent the whole identity turns on, and
    it is a quarter of the mark for the same reason it is a fraction of the page.
  -->
  <rect width="32" height="32" fill="#EEF0E8"/>
  <path d="M2 2 L15 3 L14 15 L3 14 Z" fill="#DDE3D2"/>
  <path d="M15 3 L30 2 L29 16 L14 15 Z" fill="#E4B024" fill-opacity="0.55"/>
  <path d="M3 14 L14 15 L15 30 L2 29 Z" fill="#E6EADD"/>
  <path d="M14 15 L29 16 L30 30 L15 30 Z" fill="#DDE3D2"/>
  <g fill="none" stroke="#77896C" stroke-width="1.1" stroke-linejoin="round">
    <path d="M2 2 L15 3 L14 15 L3 14 Z"/>
    <path d="M15 3 L30 2 L29 16 L14 15 Z"/>
    <path d="M3 14 L14 15 L15 30 L2 29 Z"/>
    <path d="M14 15 L29 16 L30 30 L15 30 Z"/>
  </g>
</svg>
