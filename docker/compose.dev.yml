# A Postgres for local development. Nothing else.
#
# Separate from `compose.yml`, which is the *self-hosted deployment* —
# web, worker, migrations and a database, configured the way a real board runs.
# This file is the other thing entirely: a database to point `pnpm dev` at while
# working on the code, with the app running on the host.
#
# Usage:
#
#   docker compose -f docker/compose.dev.yml up -d
#   pnpm community migrate
#   echo "<password>" | pnpm community user:create --username you --email you@example.test
#   pnpm community user:promote --user you --group administrators
#
# and in `.env` at the workspace root — one file for the app, the CLI and the
# worker alike:
#
#   DATA_SOURCE=postgres
#   DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:55432/community_test
#
# To seed a board's worth of content, `@meith/testkit`'s `seedBoard()` is the
# deterministic seeder the test suite uses — same seed, same board. It writes
# *rows*, and two things a board needs are not rows, so both have to be built
# afterwards:
#
#   pnpm community task:run counters.reconcile   # the counts the listings read
#   pnpm community search:reindex                # the tsvector search matches on
#
# Skipping the first gives a board index of zeroes, which looks wrong
# immediately. Skipping the second gives a search that runs, succeeds and
# returns nothing — which looks like a bug in search, and was reported as one.

services:
  postgres:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    # A fixed name so `docker exec forum-pg psql …` works without looking it up,
    # and so the container is recognisable among a machine's other databases.
    container_name: forum-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: community_test
    ports:
      # 55432, not 5432: a developer machine usually already has something on
      # the default port, and silently connecting to the wrong database is a
      # worse failure than a refused connection.
      - '55432:5432'
    volumes:
      - forum-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d community_test']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # **Named, and named explicitly.**
  #
  # The postgres image declares `VOLUME /var/lib/postgresql`, so a container
  # started without this still gets a volume — an *anonymous* one. Data survives
  # a restart, and even `docker rm`, but the volume cannot be reattached to a new
  # container on purpose and `docker volume prune` deletes it without asking.
  # A local board is cheap to lose and annoying to rebuild.
  #
  # `name:` pins the exact volume rather than letting compose prefix it with the
  # project directory, so `docker volume inspect forum-pgdata` finds it and a
  # container started by hand can mount the same data.
  forum-pgdata:
    name: forum-pgdata
