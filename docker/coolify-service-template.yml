# documentation: https://www.meith.dev/docs/quickstart
# slogan: Community forum software for clubs and societies that run their own board.
# tags: forum,community,bulletin-board,discussion,self-hosted
# logo: svgs/meith.svg
# port: 3000

# Meith as a Coolify one-click service.
#
# This file is the submission source for Coolify's service catalogue —
# `templates/compose/meith.yaml` in coollabsio/coolify — and is not deployed
# from this repository. Submitting an update means copying this file there
# (with the logo, once) and opening a pull request; docs/release.md says when.
#
# It is `compose.coolify.yml` with the Git-source assumptions taken out, and
# the difference is the point: a service template is copied *into* the Coolify
# resource when the resource is created, so there is no branch to move under
# it afterwards. Restart and Redeploy re-create the version the resource
# holds, and an upgrade is a deliberate act — edit MEITH_IMAGE in the
# resource's environment and redeploy. The Git-source deployment cannot make
# that promise on its own, which is why docs/quickstart.md tells the operator
# to pin MEITH_IMAGE there.
#
# The pin below is moved by every release (scripts/release-bump.mjs) and its
# agreement with the tree is enforced (scripts/release-check.mjs), the same
# as compose.coolify.yml. Coolify's copy trails behind until the catalogue
# entry is updated, and that is acceptable: whatever version it holds deploys
# exactly, and the board's admin panel says when a newer release exists.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: community
      # Generated by Coolify, once, and reused by every service below.
      #
      # `SERVICE_PASSWORD_` rather than a base64 variant because this value is
      # substituted into the postgres:// URL below, and base64's alphabet
      # includes `/` and `+`, which make the connection string unparseable.
      POSTGRES_PASSWORD: $SERVICE_PASSWORD_POSTGRES
      POSTGRES_DB: community
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U community -d community']
      interval: 10s
      timeout: 5s
      retries: 5

  # Runs to completion, then exits. `web` and `worker` wait for it, so the
  # schema is always applied before the first request — and an upgrade that
  # fails to migrate never serves the new code at all.
  migrate:
    image: ${MEITH_IMAGE:-ghcr.io/meith-dev/meith:0.11.0}
    environment:
      COMMUNITY_ROLE: migrate
      DATABASE_URL: postgres://community:$SERVICE_PASSWORD_POSTGRES@postgres:5432/community
      DATA_SOURCE: postgres
      # The migration signs nothing, and still needs these: one environment
      # contract for every role, with no carve-outs. See compose.coolify.yml.
      AUTH_SECRET: $SERVICE_BASE64_64_AUTH
      TICK_SECRET: $SERVICE_BASE64_64_TICK
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # No healthcheck declared here: the image carries a role-aware one (see
  # docker/healthcheck.sh), which asks the web server for `/api/health` and
  # the worker whether its process is alive.
  web:
    image: ${MEITH_IMAGE:-ghcr.io/meith-dev/meith:0.11.0}
    restart: unless-stopped
    environment:
      # Ask Coolify for a domain on port 3000, then hand the board the same
      # thing with a scheme in front. Without APP_URL, every link in an e-mail
      # has nothing to be absolute against.
      - SERVICE_FQDN_WEB_3000
      - APP_URL=$SERVICE_URL_WEB
      - DATABASE_URL=postgres://community:$SERVICE_PASSWORD_POSTGRES@postgres:5432/community
      - DATA_SOURCE=postgres
      # 64 characters of randomness each, generated on the first deploy. These
      # are the two values a board cannot have a default for.
      - AUTH_SECRET=$SERVICE_BASE64_64_AUTH
      - TICK_SECRET=$SERVICE_BASE64_64_TICK
      - QUEUE_DRIVER=postgres
      - CACHE_DRIVER=next
      # A real disk, shared with the worker below.
      - FILESTORE_DRIVER=local
      # Left unset, mail is configured on the board itself — the installer
      # asks on first run and /admin/settings?group=mail changes it afterwards,
      # with no redeploy. Set MAIL_DRIVER here and this file wins instead.
      - MAIL_DRIVER=${MAIL_DRIVER:-log}
      - MAIL_HTTP_ENDPOINT=${MAIL_HTTP_ENDPOINT:-}
      - MAIL_HTTP_TOKEN=${MAIL_HTTP_TOKEN:-}
      - MAIL_SMTP_HOST=${MAIL_SMTP_HOST:-}
      - MAIL_SMTP_PORT=${MAIL_SMTP_PORT:-}
      - MAIL_SMTP_SECURITY=${MAIL_SMTP_SECURITY:-}
      - MAIL_SMTP_USERNAME=${MAIL_SMTP_USERNAME:-}
      - MAIL_SMTP_PASSWORD=${MAIL_SMTP_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-}
    volumes:
      - uploads:/app/.uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # The tick, as a process rather than a schedule. Every catch-up operation
  # runs here — queued mail leaves, bans expire, digests send — so a board
  # without this service is one where nothing fails and nothing happens.
  worker:
    image: ${MEITH_IMAGE:-ghcr.io/meith-dev/meith:0.11.0}
    restart: unless-stopped
    environment:
      - COMMUNITY_ROLE=worker
      - DATABASE_URL=postgres://community:$SERVICE_PASSWORD_POSTGRES@postgres:5432/community
      - DATA_SOURCE=postgres
      - AUTH_SECRET=$SERVICE_BASE64_64_AUTH
      - TICK_SECRET=$SERVICE_BASE64_64_TICK
      - APP_URL=$SERVICE_URL_WEB
      - QUEUE_DRIVER=postgres
      # Not `next`: the worker is a plain Node process, so a cache backed by a
      # framework that is not running would be a cache of nothing.
      - CACHE_DRIVER=memory
      - FILESTORE_DRIVER=local
      - MAIL_DRIVER=${MAIL_DRIVER:-log}
      - MAIL_HTTP_ENDPOINT=${MAIL_HTTP_ENDPOINT:-}
      - MAIL_HTTP_TOKEN=${MAIL_HTTP_TOKEN:-}
      - MAIL_SMTP_HOST=${MAIL_SMTP_HOST:-}
      - MAIL_SMTP_PORT=${MAIL_SMTP_PORT:-}
      - MAIL_SMTP_SECURITY=${MAIL_SMTP_SECURITY:-}
      - MAIL_SMTP_USERNAME=${MAIL_SMTP_USERNAME:-}
      - MAIL_SMTP_PASSWORD=${MAIL_SMTP_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-}
    volumes:
      # The same volume the web service mounts. Both halves of the board write
      # uploads, and a worker with its own copy would re-encode an avatar the
      # web server cannot serve.
      - uploads:/app/.uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  uploads:
